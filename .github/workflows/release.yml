name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # required for keyless cosign signing

jobs:
  create-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure release exists for tag
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Releases are immutable once published, so assets must be attached
          # while the release is a draft; publish-release flips it at the end.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" >/dev/null 2>&1 || \
             gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" -q ".[]|select(.tag_name==\"${TAG_NAME}\")|.id" | grep -q .; then
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "puml $TAG_NAME" \
            --notes "Automated release $TAG_NAME" \
            --verify-tag \
            --draft
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build ${{ matrix.name }} binaries
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cli_binary: puml
            lsp_binary: puml-lsp
            archive_stem: puml-x86_64-unknown-linux-musl
            lsp_archive_stem: puml-lsp-x86_64-unknown-linux-musl
            binary_ext: ""
            archive_ext: tar.gz
            os_family: unix

          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cli_binary: puml
            lsp_binary: puml-lsp
            archive_stem: puml-aarch64-unknown-linux-musl
            lsp_archive_stem: puml-lsp-aarch64-unknown-linux-musl
            binary_ext: ""
            archive_ext: tar.gz
            os_family: unix

          # ── macOS ──────────────────────────────────────────────────────────
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            cli_binary: puml
            lsp_binary: puml-lsp
            archive_stem: puml-aarch64-apple-darwin
            lsp_archive_stem: puml-lsp-aarch64-apple-darwin
            binary_ext: ""
            archive_ext: tar.gz
            os_family: unix

          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cli_binary: puml
            lsp_binary: puml-lsp
            archive_stem: puml-x86_64-apple-darwin
            lsp_archive_stem: puml-lsp-x86_64-apple-darwin
            binary_ext: ""
            archive_ext: tar.gz
            os_family: unix

          # ── Windows ────────────────────────────────────────────────────────
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cli_binary: puml
            lsp_binary: puml-lsp
            archive_stem: puml-x86_64-pc-windows-msvc
            lsp_archive_stem: puml-lsp-x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: zip
            os_family: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl cross-compile support on Linux
      - name: Install musl tools (Linux)
        if: matrix.os_family == 'unix' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-stable
          cache-on-failure: true

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" --bins

      # ── Stage binaries and create archives ──────────────────────────────
      - name: Stage and archive artifacts (Unix)
        if: matrix.os_family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          CLI_BIN="target/${{ matrix.target }}/release/${{ matrix.cli_binary }}"
          LSP_BIN="target/${{ matrix.target }}/release/${{ matrix.lsp_binary }}"

          # CLI tarball: puml + LICENSE + README
          mkdir -p dist/cli-pkg
          cp "$CLI_BIN" "dist/cli-pkg/${{ matrix.cli_binary }}"
          cp LICENSE README.md dist/cli-pkg/
          tar -czf "dist/${{ matrix.archive_stem }}.tar.gz" -C dist/cli-pkg .

          # LSP tarball
          mkdir -p dist/lsp-pkg
          cp "$LSP_BIN" "dist/lsp-pkg/${{ matrix.lsp_binary }}"
          cp LICENSE README.md dist/lsp-pkg/
          tar -czf "dist/${{ matrix.lsp_archive_stem }}.tar.gz" -C dist/lsp-pkg .

      - name: Stage and archive artifacts (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $CliBin = "target\${{ matrix.target }}\release\${{ matrix.cli_binary }}${{ matrix.binary_ext }}"
          $LspBin = "target\${{ matrix.target }}\release\${{ matrix.lsp_binary }}${{ matrix.binary_ext }}"

          # CLI zip
          New-Item -ItemType Directory -Force -Path dist\cli-pkg | Out-Null
          Copy-Item $CliBin dist\cli-pkg\
          Copy-Item LICENSE,README.md dist\cli-pkg\
          Compress-Archive -Path dist\cli-pkg\* `
            -DestinationPath "dist\${{ matrix.archive_stem }}.zip" -Force

          # LSP zip
          New-Item -ItemType Directory -Force -Path dist\lsp-pkg | Out-Null
          Copy-Item $LspBin dist\lsp-pkg\
          Copy-Item LICENSE,README.md dist\lsp-pkg\
          Compress-Archive -Path dist\lsp-pkg\* `
            -DestinationPath "dist\${{ matrix.lsp_archive_stem }}.zip" -Force

      # ── SHA-256 checksums ───────────────────────────────────────────────
      - name: Generate SHA-256 checksums (Unix)
        if: matrix.os_family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${{ matrix.archive_stem }}.tar.gz" \
                    "${{ matrix.lsp_archive_stem }}.tar.gz" \
            > "checksums-${{ matrix.name }}.sha256"
          cat "checksums-${{ matrix.name }}.sha256"

      - name: Generate SHA-256 checksums (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location dist
          $hashes = @(
            "${{ matrix.archive_stem }}.zip",
            "${{ matrix.lsp_archive_stem }}.zip"
          ) | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$h  $_"
          }
          $hashes | Out-File -FilePath "checksums-${{ matrix.name }}.sha256" -Encoding utf8
          Get-Content "checksums-${{ matrix.name }}.sha256"

      # ── Cosign keyless signing ──────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archives with cosign (Unix)
        if: matrix.os_family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in "${{ matrix.archive_stem }}.tar.gz" "${{ matrix.lsp_archive_stem }}.tar.gz"; do
            cosign sign-blob --yes "$f" --bundle "${f}.cosign.bundle"
          done

      - name: Sign archives with cosign (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location dist
          foreach ($f in @("${{ matrix.archive_stem }}.zip", "${{ matrix.lsp_archive_stem }}.zip")) {
            cosign sign-blob --yes $f --bundle "${f}.cosign.bundle"
          }

      # ── Upload all assets to GitHub release ─────────────────────────────
      - name: Upload assets to GitHub release (Unix)
        if: matrix.os_family == 'unix'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            dist/${{ matrix.archive_stem }}.tar.gz
            dist/${{ matrix.archive_stem }}.tar.gz.cosign.bundle
            dist/${{ matrix.lsp_archive_stem }}.tar.gz
            dist/${{ matrix.lsp_archive_stem }}.tar.gz.cosign.bundle
            dist/checksums-${{ matrix.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to GitHub release (Windows)
        if: matrix.os_family == 'windows'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            dist/${{ matrix.archive_stem }}.zip
            dist/${{ matrix.archive_stem }}.zip.cosign.bundle
            dist/${{ matrix.lsp_archive_stem }}.zip
            dist/${{ matrix.lsp_archive_stem }}.zip.cosign.bundle
            dist/checksums-${{ matrix.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Merge per-platform checksum files into one canonical artifact ──────
  merge-checksums:
    name: Publish merged checksum file
    needs:
      - create-release
      - build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Download per-platform checksum files (draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            -q ".[]|select(.tag_name==\"${TAG_NAME}\")|.assets[]|select(.name|test(\"^checksums-.*[.]sha256$\"))|\"\\(.id) \\(.name)\"" |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "checksums/${name}"
          done
          ls checksums

      - name: Merge into SHA256SUMS
        run: |
          set -euo pipefail
          cat checksums/checksums-*.sha256 | sort -k2 > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Upload merged SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    name: Build and upload wasm artifact
    needs: create-release
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm-ubuntu-stable
          cache-on-failure: true

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Build and package wasm artifact
        id: package_wasm
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OUT_DIR: dist
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # The wasm entry point is the crates/puml-wasm workspace member (cdylib);
          # the root package is not a cdylib. --out-dir is relative to that crate.
          wasm-pack build --release --target web --out-dir "$PWD/$OUT_DIR/puml-wasm" crates/puml-wasm
          tar -czf "$OUT_DIR/puml-wasm-web-${RELEASE_TAG}.tar.gz" -C "$OUT_DIR" puml-wasm
          echo "artifact_path=$OUT_DIR/puml-wasm-web-${RELEASE_TAG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "artifact_name=puml-wasm-web-${RELEASE_TAG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum for wasm
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "puml-wasm-web-${RELEASE_TAG}.tar.gz" > checksums-wasm.sha256
          cat checksums-wasm.sha256

      - name: Upload wasm artifact to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            ${{ steps.package_wasm.outputs.artifact_path }}
            dist/checksums-wasm.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub release
    needs:
      - create-release
      - build-and-publish
      - merge-checksums
      - build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release (makes it immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" -q ".[]|select(.tag_name==\"${TAG_NAME}\" and .draft)|.id" | head -1)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F draft=false

  publish-to-cargo:
    name: Publish crate
    runs-on: ubuntu-latest
    needs:
      - publish-release
    permissions:
      contents: read
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("Cargo.toml").read_text()
          m = re.search(r'^version\s*=\s*"\d+\.\d+\.\d+"', text, re.M)
          if not m:
              raise SystemExit("No version line found in Cargo.toml")
          print(m.group(0).split('"')[1])
          PY
          )"
          if [ "$TAG_NAME" != "$CARGO_VERSION" ]; then
            echo "Tag version $TAG_NAME does not match Cargo version $CARGO_VERSION"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret."
            exit 1
          fi
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

  # ── Homebrew formula in alliecatowo/homebrew-tap ────────────────────────
  # Renders Formula/puml.rb from the release's SHA256SUMS and pushes it to the
  # shared tap over SSH with a write deploy key (secret HOMEBREW_TAP_DEPLOY_KEY,
  # no PAT). Skipped for pre-release tags. Nothing depends on this job.
  update-homebrew:
    name: Update Homebrew formula
    needs:
      - create-release
      - publish-release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
    steps:
      - name: Download SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

      - name: Render and push Formula/puml.rb
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot update the tap"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          sha() {
            local s
            s="$(awk -v f="puml-$1.tar.gz" '$2 == f {print $1}' SHA256SUMS)"
            if [ -z "$s" ]; then echo "::error::no checksum for puml-$1.tar.gz" >&2; exit 1; fi
            echo "$s"
          }
          MAC_ARM_SHA="$(sha aarch64-apple-darwin)"
          MAC_X86_SHA="$(sha x86_64-apple-darwin)"
          LINUX_ARM_SHA="$(sha aarch64-unknown-linux-musl)"
          LINUX_X86_SHA="$(sha x86_64-unknown-linux-musl)"

          cat > puml.rb <<EOF
          # Homebrew formula for puml. Generated by the update-homebrew job in
          # alliecatowo/puml (.github/workflows/release.yml) on each stable release. Do not edit by hand.
          class Puml < Formula
            desc "Fast, no-Java PlantUML-compatible diagram renderer"
            homepage "https://github.com/alliecatowo/puml"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/puml-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              end
              on_intel do
                url "${base}/puml-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/puml-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "${base}/puml-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "puml"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/puml --version")
            end
          end
          EOF

          install -d -m 700 ~/.ssh
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:alliecatowo/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp puml.rb tap/Formula/puml.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tap already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/puml.rb
          git commit -m "puml ${VERSION}"
          git push origin HEAD:main

  # VS Code extension (extensions/vscode). Ships with each puml release on the
  # same `v*` tag; the extension needs the released `puml` CLI binary.
  # Pre-release tags (containing '-') are skipped.
  package-vscode:
    name: Package VS Code extension
    needs:
      - build-and-publish
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Package vsix (version taken from the tag)
        working-directory: extensions/vscode
        run: |
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm run build
          npx --yes @vscode/vsce package -o puml-vscode.vsix

      - name: Upload vsix
        uses: actions/upload-artifact@v7
        with:
          name: puml-vscode-vsix
          path: extensions/vscode/puml-vscode.vsix
          if-no-files-found: error

  publish-vscode-open-vsx:
    name: Publish extension to Open VSX
    needs: package-vscode
    runs-on: ubuntu-latest
    # Open VSX trusted publishing is bound to this environment name.
    environment: open-vsx
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download vsix
        uses: actions/download-artifact@v8
        with:
          name: puml-vscode-vsix

      - name: Publish
        run: npx --yes ovsx@1.2.0 publish puml-vscode.vsix --trusted-publishing --skip-duplicate

  publish-vscode-marketplace:
    name: Publish extension to VS Code Marketplace
    needs: package-vscode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download vsix
        uses: actions/download-artifact@v8
        with:
          name: puml-vscode-vsix

      - name: Publish (skipped when VSCE_PAT is not set)
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath puml-vscode.vsix
